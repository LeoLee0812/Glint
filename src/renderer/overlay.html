<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>LookAsk Overlay</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
      #blob { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
      #focus { position: fixed; border-radius: 10px; pointer-events: none; display: none;
        background: rgba(0, 122, 255, 0.14);
        transition: left 140ms cubic-bezier(0.25, 0.8, 0.25, 1), top 140ms cubic-bezier(0.25, 0.8, 0.25, 1),
          width 140ms cubic-bezier(0.25, 0.8, 0.25, 1), height 140ms cubic-bezier(0.25, 0.8, 0.25, 1); }
      #focus.soft { border: 1.5px solid rgba(30, 170, 240, 0.35); background: rgba(30, 170, 240, 0.05); }
      #label { position: fixed; pointer-events: none; display: none; font: 600 12px -apple-system, "PingFang SC", sans-serif;
        color: #fff; background: #007aff; padding: 3px 10px; border-radius: 99px; white-space: nowrap;
        box-shadow: 0 2px 8px rgba(0, 122, 255, 0.35); }
    </style>
  </head>
  <body>
    <div id="focus"></div>
    <div id="label"></div>
    <canvas id="blob"></canvas>
    <script type="module" src="./overlay/overlay.ts"></script>
  </body>
</html>
