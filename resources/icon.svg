<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ecf1"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c30"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd8ff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#1eaaf0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1eaaf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inner" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bfe8ff" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a3a66" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  <!-- ı 的竖：墨色圆头 -->
  <rect x="459" y="470" width="106" height="330" rx="53" fill="url(#stem)" filter="url(#soft)"/>
  <!-- i 上的点 = 视线光环 -->
  <circle cx="512" cy="330" r="150" fill="url(#halo)"/>
  <circle cx="512" cy="330" r="84" fill="url(#inner)"/>
  <circle cx="512" cy="330" r="84" fill="none" stroke="url(#ring)" stroke-width="26"/>
  <circle cx="512" cy="330" r="84" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5"/>
  <!-- 一点高光（glint） -->
  <path d="M478 296 q4 -26 10 0 q26 4 0 10 q-6 26 -10 0 q-26 -6 0 -10 z" fill="#ffffff" opacity="0.95"/>
</svg>
