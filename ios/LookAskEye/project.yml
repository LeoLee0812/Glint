# LookAskEye 工程描述（XcodeGen）：改完跑 `xcodegen generate` 重新生成 LookAskEye.xcodeproj
name: LookAskEye
options:
  bundleIdPrefix: com.leo.lookask
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 本机 Xcode 里登录的个人团队（免费证书，装到手机上 7 天后要重装）
    DEVELOPMENT_TEAM: 9VJA7ZAMD7
    CODE_SIGN_STYLE: Automatic
targets:
  LookAskEye:
    type: application
    platform: iOS
    sources:
      - LookAskEye
    info:
      path: LookAskEye/Info.plist
      properties:
        CFBundleDisplayName: LookAskEye
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        NSCameraUsageDescription: LookAskEye 用前置原深感摄像头追踪你的头和眼睛：数据只发给你自己的 Mac，不录像、不上传。
        NSLocalNetworkUsageDescription: 在局域网里找到你 Mac 上的 LookAsk，并把眼动数据发过去（只在本地网络里传）。
        NSBonjourServices:
          - _lookask._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leo.lookask.eye
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - LookAskEyeTests
  LookAskEyeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LookAskEyeTests
    dependencies:
      - target: LookAskEye
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.leo.lookask.eye.tests
