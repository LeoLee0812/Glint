# LookAsk 打包配置：只出 Apple 芯片的 dmg；没有开发者证书，打完包做 ad-hoc 签名
appId: com.leo.lookask
productName: LookAsk
copyright: Copyright © 2026 Leo
directories:
  buildResources: resources
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  - from: native/bin/lookask-bridge
    to: bin/lookask-bridge
npmRebuild: false
# 只留中英文界面资源
electronLanguages:
  - zh_CN
  - en
mac:
  target:
    - target: dmg
      arch: arm64
  icon: resources/icon.icns
  category: public.app-category.productivity
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  minimumSystemVersion: '13.0'
  extendInfo:
    NSCameraUsageDescription: LookAsk 用摄像头做眼动追踪：画面只在本机实时处理，不录制、不上传。
    NSMicrophoneUsageDescription: 按住 Joy-Con 扳机说话时，需要用麦克风把你的问题转成文字。
    NSSpeechRecognitionUsageDescription: LookAsk 用系统语音识别把你说的话转成文字，Apple 芯片上在本机完成。
    NSAppleEventsUsageDescription: 全局模式下读取其他应用里的文字，给 AI 当上下文。
afterPack: scripts/after-pack.cjs
dmg:
  title: LookAsk ${version}
  writeUpdateInfo: false
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications
